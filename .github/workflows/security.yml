name: Seguridad

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Semanal: detecta CVEs nuevas aunque no haya commits.
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  auditoria:
    name: Dependencias y secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Auditoría de dependencias (falla ante high/critical nuevas)
        run: npm run security:audit
      - name: Escaneo de secretos en todo el historial
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    name: Lint, tipos, build y aislamiento entre empresas
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: traza
          POSTGRES_PASSWORD: traza
          POSTGRES_DB: traza
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U traza"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://traza:traza@localhost:5432/traza
      # Secreto efímero solo para CI (no es el de producción).
      JWT_SECRET: ci-only-secret-0123456789abcdefghijklmnopqrstuvwxyz
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Chequeo de tipos (genera antes los tipos de rutas de Next)
        run: npx next typegen && npx tsc --noEmit
      - name: Tests de reglas de seguridad
        run: npm run test:security
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Levantar la app
        run: |
          npm start &
          npx --yes wait-on@8.0.3 http://localhost:3000/login --timeout 60000
      - name: Test de aislamiento entre empresas (obligatorio)
        run: npm run test:tenant-isolation
